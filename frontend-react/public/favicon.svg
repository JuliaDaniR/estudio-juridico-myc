<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#251A2B"/>
      <stop offset="50%" stop-color="#140D1B"/>
      <stop offset="100%" stop-color="#0B080F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4"/>
      <stop offset="50%" stop-color="#D4B16A"/>
      <stop offset="100%" stop-color="#AA8236"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D4B16A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo redondo Dark Glass -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Balanza de la Justicia (Scales of Justice) -->
  <g filter="url(#goldGlow)" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Remate superior -->
    <circle cx="32" cy="14" r="2.2" fill="url(#goldGrad)" stroke="none"/>

    <!-- Pilar central vertical -->
    <line x1="32" y1="16" x2="32" y2="48" stroke-width="2.5"/>

    <!-- Base del pilar -->
    <path d="M22 50 L42 50 M25 48 L39 48" stroke-width="2.2"/>

    <!-- Travesaño horizontal -->
    <path d="M16 22 L32 20 L48 22" stroke-width="2.4" fill="none"/>

    <!-- Plato Izquierdo -->
    <line x1="16" y1="22" x2="11" y2="33" stroke-width="1.3"/>
    <line x1="16" y1="22" x2="21" y2="33" stroke-width="1.3"/>
    <path d="M9 33 Q16 39 23 33 Z" fill="url(#goldGrad)" stroke-width="1"/>

    <!-- Plato Derecho -->
    <line x1="48" y1="22" x2="43" y2="33" stroke-width="1.3"/>
    <line x1="48" y1="22" x2="53" y2="33" stroke-width="1.3"/>
    <path d="M41 33 Q48 39 55 33 Z" fill="url(#goldGrad)" stroke-width="1"/>
  </g>
</svg>